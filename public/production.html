<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Production Input — Thelvic Ledger</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <nav id="mainNav"></nav>

  <main>
    <h1>Daily Production</h1>
    <p class="subtitle">Record how many loaves of each brand were baked</p>

    <div class="card">
      <h2>Enter Production</h2>
      <div class="form-row">
        <div>
          <label for="prodDate">Date</label>
          <input type="date" id="prodDate">
        </div>
      </div>
      <div id="prodInputs"></div>
      <div class="form-row" style="margin-top:1rem">
        <button class="btn btn-primary" id="saveProduction">Save Production</button>
      </div>
    </div>

    <div class="card">
      <h2 id="todayProductionHeading">Today's Production</h2>
      <div style="overflow-x:auto">
        <table id="recentProduction">
          <thead>
            <tr><th>Brand</th><th>Quantity</th><th>Est. Material Cost</th><th></th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/production.js"></script>
</body>
</html>
